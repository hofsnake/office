<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot Office · Underwater Research Station</title>
<style>
  :root { --ink:#dcebf3; --dim:#9db8c6; --panel:rgba(8,26,40,.82); --line:rgba(120,180,210,.25); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0a3350; color:var(--ink); font:13px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #tags { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .tag { position:absolute; left:0; top:0; pointer-events:auto; cursor:default; font-size:9.5px; line-height:1; padding:2px 4px; border-radius:3px; background:rgba(6,22,34,.5); color:rgba(205,225,236,.72); white-space:nowrap; transform:translate(-50%,-100%); will-change:transform; user-select:none; }
  .tag .full { display:none; }
  .tag:hover, .tag.open { background:rgba(6,22,34,.92); color:#fff; z-index:20; font-size:11px; padding:5px 8px; }
  .tag:hover .short, .tag.open .short { display:none; }
  .tag:hover .full, .tag.open .full { display:block; }
  .tag .full b { font-weight:700; } .tag .full i { font-style:normal; color:var(--dim); display:block; margin-top:2px; }
  .tag .dot { display:inline-block; width:5px; height:5px; border-radius:50%; margin-right:3px; vertical-align:1px; }
  #hud-top { position:fixed; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; gap:8px; align-items:flex-start; justify-content:space-between; pointer-events:none; }
  .chip { pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 11px; backdrop-filter:blur(4px); }
  #title b { display:block; font-size:14px; } #title span { color:var(--dim); font-size:11px; }
  #usage-chip { font-size:12px; text-align:right; } #usage-chip b { font-size:15px; }
  #teambtn { pointer-events:auto; cursor:pointer; color:var(--ink); font:inherit; }
  #panel { position:fixed; top:64px; left:10px; width:310px; max-height:calc(100% - 150px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 4px; display:none; backdrop-filter:blur(4px); }
  #panel.show { display:block; }
  #panel h4 { margin:6px 10px 4px; font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
  .row { display:grid; grid-template-columns:14px 1fr auto; gap:2px 8px; align-items:center; padding:5px 10px; cursor:pointer; }
  .row:hover { background:rgba(120,180,210,.1); }
  .sw { width:12px; height:12px; border-radius:3px; border:1px solid rgba(255,255,255,.25); }
  .nm { font-weight:600; } .nm small { font-weight:400; color:var(--dim); margin-left:6px; }
  .st { font-size:10.5px; padding:1px 6px; border-radius:8px; background:rgba(255,255,255,.08); color:var(--dim); }
  .st.working { background:#1f6b3a; color:#d8ffe6; } .st.waiting { background:#7a5a14; color:#fff0c8; } .st.error { background:#7a2a22; color:#ffd8d2; } .st.done { background:#1f4a7a; color:#d8ebff; }
  .ln { grid-column:2 / 4; font-size:11.5px; color:var(--dim); min-height:14px; }
  #warn { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:#7a5a14; color:#fff0c8; border:1px solid #c9a23a; padding:6px 12px; border-radius:8px; display:none; font-size:12px; z-index:30; max-width:92vw; text-align:center; }
  #bottom { position:fixed; bottom:max(14px, env(safe-area-inset-bottom)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  #simlabel { display:none; pointer-events:none; font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:20px; background:rgba(232,166,74,.18); border:1px solid rgba(232,166,74,.6); color:#f3c98a; }
  #simbtn { pointer-events:auto; cursor:pointer; font:600 13px inherit; color:#e8f4fa; background:#1d5f84; border:1px solid #4aa9d4; border-radius:22px; padding:10px 20px; min-height:42px; }
  #simbtn.on { background:#7a4f1a; border-color:#e8a64a; }
  @media (max-width:640px) { #panel { width:auto; right:10px; top:60px; max-height:calc(100% - 140px); } #title span { display:none; } #usage-chip { font-size:11px; } }
</style>
</head>
<body>
<div id="app"></div><div id="tags"></div>
<div id="hud-top">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="chip" id="title"><b>Bot Office</b><span>Underwater research station</span></div>
    <button class="chip" id="teambtn" aria-expanded="false">Team ▾</button>
  </div>
  <div class="chip" id="usage-chip">No usage reading yet</div>
</div>
<div id="panel"></div>
<div id="warn"></div>
<div id="bottom"><div id="simlabel">Simulation</div><button id="simbtn">Simulate Work</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
